name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.26.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
